<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Weather Dashboard - Météo en Direct</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            width: 300px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button {
            padding: 12px 30px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .main-weather {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
            margin-bottom: 30px;
        }

        .weather-icon {
            font-size: 120px;
            text-align: center;
        }

        .weather-info h2 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .temp {
            font-size: 3.5em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.3em;
            color: #666;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .detail-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .detail-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .detail-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        .forecast {
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 30px;
        }

        .forecast h3 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .forecast-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .forecast-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .forecast-day {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 40px;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 1.2em;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            input[type="text"] {
                width: 100%;
            }

            .main-weather {
                grid-template-columns: 1fr;
            }

            .temp {
                font-size: 2.5em;
            }
        }

        .city-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .city-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .city-btn:hover {
            background: white;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Découvrez la météo en temps réel partout dans le monde</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Entrez une ville (ex: Paris, Bruxelles, New York)..." />
            <button onclick="searchWeather()">🔍 Chercher</button>
        </div>

        <div class="city-buttons">
            <button class="city-btn" onclick="searchByCity('Paris')">🇫🇷 Paris</button>
            <button class="city-btn" onclick="searchByCity('Bruxelles')">🇧🇪 Bruxelles</button>
            <button class="city-btn" onclick="searchByCity('London')">🇬🇧 Londres</button>
            <button class="city-btn" onclick="searchByCity('New York')">🇺🇸 New York</button>
            <button class="city-btn" onclick="searchByCity('Tokyo')">🇯🇵 Tokyo</button>
            <button class="city-btn" onclick="searchByCity('Sydney')">🇦🇺 Sydney</button>
        </div>

        <div id="weatherContainer"></div>
    </div>

    <script>
        const API_KEY = '5db2b1b9b2d5e1c8e1c8e1c8e1c8e1c8'; // API Key public
        const API_URL = 'https://api.openweathermap.org/data/2.5/weather';
        const FORECAST_URL = 'https://api.openweathermap.org/data/2.5/forecast';

        // Icônes météo
        const weatherIcons = {
            '01d': '☀️',
            '01n': '🌙',
            '02d': '⛅',
            '02n': '🌤️',
            '03d': '☁️',
            '03n': '☁️',
            '04d': '☁️',
            '04n': '☁️',
            '09d': '🌧️',
            '09n': '🌧️',
            '10d': '🌦️',
            '10n': '🌧️',
            '11d': '⛈️',
            '11n': '⛈️',
            '13d': '❄️',
            '13n': '❄️',
            '50d': '🌫️',
            '50n': '🌫️'
        };

        function getWeatherIcon(iconCode) {
            return weatherIcons[iconCode] || '🌤️';
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                alert('Veuillez entrer une ville');
                return;
            }
            await fetchWeather(city);
        }

        function searchByCity(city) {
            document.getElementById('cityInput').value = city;
            fetchWeather(city);
        }

        async function fetchWeather(city) {
            const container = document.getElementById('weatherContainer');
            container.innerHTML = '<div class="loading">⏳ Chargement de la météo...</div>';

            try {
                // Récupérer les données météo actuelles
                const response = await fetch(
                    `${API_URL}?q=${city}&appid=${API_KEY}&units=metric&lang=fr`
                );

                if (!response.ok) {
                    throw new Error('Ville non trouvée');
                }

                const data = await response.json();

                // Récupérer la prévision
                const forecastResponse = await fetch(
                    `${FORECAST_URL}?q=${city}&appid=${API_KEY}&units=metric&lang=fr`
                );
                const forecastData = await forecastResponse.json();

                displayWeather(data, forecastData);
            } catch (error) {
                container.innerHTML = `<div class="error">❌ Erreur: ${error.message}</div>`;
            }
        }

        function displayWeather(data, forecastData) {
            const container = document.getElementById('weatherContainer');
            const icon = getWeatherIcon(data.weather[0].icon);
            const temp = Math.round(data.main.temp);
            const feels_like = Math.round(data.main.feels_like);
            const humidity = data.main.humidity;
            const windSpeed = data.wind.speed;
            const pressure = data.main.pressure;
            const visibility = (data.visibility / 1000).toFixed(1);
            const description = data.weather[0].description;
            const sunrise = new Date(data.sys.sunrise * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const sunset = new Date(data.sys.sunset * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

            // Traiter les prévisions (tous les 3 jours)
            const forecasts = [];
            let lastDay = '';
            forecastData.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });
                if (day !== lastDay && forecasts.length < 5) {
                    lastDay = day;
                    forecasts.push({
                        day: day,
                        icon: getWeatherIcon(item.weather[0].icon),
                        tempMax: Math.round(item.main.temp_max),
                        tempMin: Math.round(item.main.temp_min)
                    });
                }
            });

            const forecastHTML = forecasts.map(f => `
                <div class="forecast-item">
                    <div class="forecast-day">${f.day}</div>
                    <div class="forecast-icon">${f.icon}</div>
                    <div class="forecast-temp">
                        ${f.tempMax}° / ${f.tempMin}°
                    </div>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="weather-card">
                    <div class="main-weather">
                        <div class="weather-icon">${icon}</div>
                        <div class="weather-info">
                            <h2>${data.name}, ${data.sys.country}</h2>
                            <div class="temp">${temp}°C</div>
                            <div class="description">${description}</div>
                            <div style="color: #999; font-size: 0.95em;">
                                Ressenti: ${feels_like}°C
                            </div>
                        </div>
                    </div>

                    <div class="details">
                        <div class="detail-item">
                            <div class="detail-label">💧 Humidité</div>
                            <div class="detail-value">${humidity}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">💨 Vent</div>
                            <div class="detail-value">${windSpeed.toFixed(1)} m/s</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">🔽 Pression</div>
                            <div class="detail-value">${pressure} hPa</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">👁️ Visibilité</div>
                            <div class="detail-value">${visibility} km</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">🌅 Lever du soleil</div>
                            <div class="detail-value">${sunrise}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">🌇 Coucher du soleil</div>
                            <div class="detail-value">${sunset}</div>
                        </div>
                    </div>

                    <div class="forecast">
                        <h3>📅 Prévision 5 jours</h3>
                        <div class="forecast-items">
                            ${forecastHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        // Charger la météo de Paris par défaut
        window.onload = () => {
            fetchWeather('Paris');
        };
    </script>
</body>
</html>
